[project]
name = "mentor-connect-api"
version = "0.1.0"
description = "Mentor Connect API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
